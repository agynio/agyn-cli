version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/agynio/agyn-cli/gen
plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen
    opt:
      - paths=source_relative
  - remote: buf.build/connectrpc/go
    out: gen
    opt:
      - paths=source_relative
inputs:
  # The sync endpoint and daemon protocols are spoken between two copies of this
  # binary and cross no service boundary, so they live here rather than in the
  # platform's shared API module.
  - directory: proto
  - module: buf.build/agynio/api
    paths:
      - agynio/api/gateway/v1/apps.proto
      - agynio/api/gateway/v1/egress.proto
      - agynio/api/gateway/v1/files.proto
      - agynio/api/gateway/v1/groups.proto
      - agynio/api/gateway/v1/networks.proto
      - agynio/api/gateway/v1/expose.proto
      - agynio/api/gateway/v1/notifications.proto
      - agynio/api/gateway/v1/threads.proto
      - agynio/api/gateway/v1/users.proto
      - agynio/api/gateway/v1/agents.proto
      - agynio/api/gateway/v1/terminal.proto
      - agynio/api/gateway/v1/organizations.proto
      - agynio/api/gateway/v1/llm.proto
      - agynio/api/agents/v1/agents.proto
      - agynio/api/llm/v1/llm.proto
      - agynio/api/organizations/v1/organizations.proto
      - agynio/api/terminal_proxy/v1/terminal_proxy.proto
      - agynio/api/apps/v1/apps.proto
      - agynio/api/egress/v1/egress.proto
      - agynio/api/files/v1/files.proto
      - agynio/api/groups/v1/groups.proto
      - agynio/api/networks/v1/networks.proto
      - agynio/api/expose/v1/expose.proto
      - agynio/api/notifications/v1/notifications.proto
      - agynio/api/threads/v1/threads.proto
      - agynio/api/users/v1/users.proto
