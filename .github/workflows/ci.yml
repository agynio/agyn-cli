name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - uses: bufbuild/buf-setup-action@v1
      - name: Generate
        run: buf generate
      - name: Vet
        # third_party/ is vendored upstream source, edited only to rewrite import
        # paths. Vetting it would report style in code we do not own, and fixing
        # that would break the diff against upstream that makes a refresh
        # reviewable.
        run: go vet ./cmd/... ./internal/...
      - name: Test
        run: go test ./cmd/... ./internal/...
      - name: Command smoke test
        run: bash scripts/command_smoke_test.sh
      - name: Build
        run: go build ./cmd/agyn
