name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/agynio/agyn-cli
  INIT_IMAGE_NAME: ghcr.io/agynio/agyn-cli-init

jobs:
  tag-check:
    name: Ensure tag is on main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"; then
            echo "Release tag must point to a commit on main."
            exit 1
          fi
  binary:
    name: Build and release binary
    runs-on: ubuntu-latest
    needs: [tag-check]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Set up Buf
        uses: bufbuild/buf-setup-action@v1

      - name: Generate
        run: buf generate

      # macOS builds matter as much as Linux here: `agyn local` runs a Lima VM
      # on the user's own machine, and that is a laptop. They are also what the
      # Homebrew formula installs.
      #
      # Archives rather than bare binaries, named the way the tap's other
      # formulae expect: agyn_v0.2.13_darwin_arm64.tar.gz. The bare
      # agyn-linux-* names stay so existing installs keep working.
      - name: Build binaries
        env:
          CGO_ENABLED: 0
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          ldflags="-s -w -X github.com/agynio/agyn-cli/internal/cmd.version=${VERSION#v}"
          for platform in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os="${platform%/*}"
            arch="${platform#*/}"
            GOOS="${os}" GOARCH="${arch}" go build -trimpath -ldflags="${ldflags}" -o "dist/agyn" ./cmd/agyn
            tar -czf "dist/agyn_${VERSION}_${os}_${arch}.tar.gz" -C dist agyn
            if [ "${os}" = "linux" ]; then
              cp dist/agyn "dist/agyn-linux-${arch}"
            fi
            rm dist/agyn
          done
          (cd dist && shasum -a 256 *.tar.gz > checksums.sha256)
          ls -l dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/agyn_*.tar.gz
            dist/checksums.sha256
            dist/agyn-linux-amd64
            dist/agyn-linux-arm64

  image:
    name: Build and push container image
    runs-on: ubuntu-latest
    needs: [tag-check]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=agyn-cli
          cache-to: type=gha,scope=agyn-cli,mode=max

      - name: Verify multi-arch manifest
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          INSPECT="$(docker buildx imagetools inspect "$IMAGE_NAME:$TAG" --raw)"
          FOUND="$(echo "$INSPECT" | jq -r '[.manifests[].platform.architecture] | sort | join(",")')"
          MISSING=()
          for ARCH in amd64 arm64; do
            if ! echo "$FOUND" | grep -q "$ARCH"; then
              MISSING+=("linux/$ARCH")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Missing architectures in $IMAGE_NAME:$TAG: ${MISSING[*]}"
            exit 1
          fi
          echo "Manifest $IMAGE_NAME:$TAG includes linux/amd64 and linux/arm64"

      # The init-container form, injected into every workload. Same binary,
      # same version - only the delivery differs, so it releases here rather
      # than from a repository of its own.
      - name: Extract Docker metadata for the init image
        id: meta-init
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.INIT_IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push the init image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.init
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-init.outputs.tags }}
          labels: ${{ steps.meta-init.outputs.labels }}
          cache-from: type=gha,scope=agyn-cli-init
          cache-to: type=gha,scope=agyn-cli-init,mode=max

      - name: Verify multi-arch manifest for the init image
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          INSPECT="$(docker buildx imagetools inspect "$INIT_IMAGE_NAME:$TAG" --raw)"
          FOUND="$(echo "$INSPECT" | jq -r '[.manifests[].platform.architecture] | sort | join(",")')"
          MISSING=()
          for ARCH in amd64 arm64; do
            if ! echo "$FOUND" | grep -q "$ARCH"; then
              MISSING+=("linux/$ARCH")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Missing architectures in $INIT_IMAGE_NAME:$TAG: ${MISSING[*]}"
            exit 1
          fi
          echo "Manifest $INIT_IMAGE_NAME:$TAG includes linux/amd64 and linux/arm64"

  homebrew:
    name: Update the Homebrew formula
    runs-on: ubuntu-latest
    needs: [binary]
    steps:
      - name: Checkout the tap
        uses: actions/checkout@v4
        with:
          repository: agynio/homebrew-tap
          # GITHUB_TOKEN is scoped to this repository and cannot push to the
          # tap, so this needs a PAT with contents:write on agynio/homebrew-tap.
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # Rewritten from the release's own checksums rather than hand-edited:
      # four URLs and four hashes per release is precisely the kind of manual
      # step that is wrong in a way nobody notices until an install fails.
      - name: Render the formula
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          base="https://github.com/agynio/agyn-cli/releases/download/${TAG}"

          curl -fsSL "${base}/checksums.sha256" -o /tmp/checksums.sha256
          cat /tmp/checksums.sha256

          sha() { awk -v f="agyn_${TAG}_$1_$2.tar.gz" '$2 == f { print $1 }' /tmp/checksums.sha256; }
          for pair in "darwin arm64" "darwin amd64" "linux arm64" "linux amd64"; do
            set -- ${pair}
            if [ -z "$(sha "$1" "$2")" ]; then
              echo "::error::no checksum for agyn_${TAG}_$1_$2.tar.gz"
              exit 1
            fi
          done

          mkdir -p Formula
          cat > Formula/agyn.rb <<EOF
          class Agyn < Formula
            desc "CLI for the Agyn platform"
            homepage "https://github.com/agynio/agyn-cli"
            version "${version}"

            on_macos do
              if Hardware::CPU.arm?
                url "${base}/agyn_${TAG}_darwin_arm64.tar.gz"
                sha256 "$(sha darwin arm64)"
              else
                url "${base}/agyn_${TAG}_darwin_amd64.tar.gz"
                sha256 "$(sha darwin amd64)"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "${base}/agyn_${TAG}_linux_arm64.tar.gz"
                sha256 "$(sha linux arm64)"
              else
                url "${base}/agyn_${TAG}_linux_amd64.tar.gz"
                sha256 "$(sha linux amd64)"
              end
            end

            def install
              bin.install "agyn"
            end

            # \`agyn local\` additionally needs limactl, qemu and xz. They are not
            # formula dependencies: most of that is a large install, and someone
            # using agyn against a remote cluster needs none of it.
            # \`agyn local doctor\` reports what is missing and how to get it.
            def caveats
              <<~EOS
                To run the local platform VM, install its dependencies:
                  brew install lima xz
                Then check the environment with:
                  agyn local doctor
              EOS
            end

            test do
              assert_match "agyn version", shell_output("#{bin}/agyn --version")
            end
          end
          EOF
          cat Formula/agyn.rb

      - name: Commit and push
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Staged before the comparison, because an untracked file has no diff
          # against the index: checking first reported "already at ${TAG}" for a
          # formula that had never been committed at all, on every release.
          git add Formula/agyn.rb
          if git diff --cached --quiet -- Formula/agyn.rb; then
            echo "Formula already at ${TAG}"
            exit 0
          fi
          git commit -m "agyn ${TAG}"
          git push
